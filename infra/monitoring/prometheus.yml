global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "krocpdf-backend-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend-api:3000"]

  - job_name: "krocpdf-redis-streams"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "krocpdf-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

