apiVersion: apps/v1
kind: Deployment
metadata:
  name: krocpdf-backend
  namespace: krocpdf
  labels:
    app.kubernetes.io/name: krocpdf-backend
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: krocpdf-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krocpdf-backend
    spec:
      containers:
        - name: backend-api
          image: ghcr.io/krocpdf/backend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: krocpdf-config
            - secretRef:
                name: krocpdf-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: krocpdf-backend
  namespace: krocpdf
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: krocpdf-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: krocpdf-backend-hpa
  namespace: krocpdf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: krocpdf-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
