apiVersion: apps/v1
kind: Deployment
metadata:
  name: krocpdf-worker
  namespace: krocpdf
  labels:
    app.kubernetes.io/name: krocpdf-worker
    app.kubernetes.io/component: conversion-engine
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: krocpdf-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krocpdf-worker
    spec:
      containers:
        - name: worker-service
          image: ghcr.io/krocpdf/worker-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: krocpdf-config
            - secretRef:
                name: krocpdf-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: krocpdf-worker-hpa
  namespace: krocpdf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: krocpdf-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
