name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Detection
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Scanning commits in Pull Request against target branch..."
            gitleaks detect --verbose --redact --config=.gitleaks.toml --log-opts="origin/main..HEAD"
          else
            echo "Scanning repository commits..."
            gitleaks detect --verbose --redact --config=.gitleaks.toml
          fi
