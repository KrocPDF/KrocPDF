name: CI - Backend API

on:
  push:
    branches:
      - main
    paths:
      - 'backend-api/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend-api/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-api

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/jpg2pdf?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build NestJS Production Bundle
        run: npm run build
