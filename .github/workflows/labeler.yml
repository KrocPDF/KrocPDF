name: Advanced Monorepo Labeler

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - synchronize
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage-and-label:
    name: Auto Triage & Label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v4

      - name: Run Unified Auto-Labeler
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runAutoLabeler = require('./.github/scripts/auto-labeler.cjs');
            await runAutoLabeler({ github, context, core });
