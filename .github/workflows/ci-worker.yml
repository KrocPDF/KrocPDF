name: CI - Worker Service

on:
  push:
    branches:
      - main
    paths:
      - 'worker-service/**'
      - '.github/workflows/ci-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'worker-service/**'
      - '.github/workflows/ci-worker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Go Lint, Vet & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: worker-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
          cache-dependency-path: worker-service/go.sum

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./...

      - name: Verify Docker Build
        run: docker build -t worker-test .
