name: CI - Worker Service

on:
  push:
    branches:
      - main
    paths:
      - 'worker-service/**'
      - '.github/workflows/ci-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'worker-service/**'
      - '.github/workflows/ci-worker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Go Lint, Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: worker-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Worker Builder Image
        run: docker build --target builder -t worker-builder .

      - name: Go Vet
        run: docker run --rm worker-builder go vet ./...

      - name: Run Go Tests
        run: docker run --rm worker-builder go test -v ./...

      - name: Verify Final Production Docker Build
        run: docker build -t worker-test .
